# Firebase App Hosting. Plain Firebase Hosting serves static files only, and
# this app needs a Node runtime for the console, the Firestore reads behind
# /s and /t, the cron sweeper, and Next's own server rendering.
#
# The runtime service account supplies Application Default Credentials, so no
# Firebase key is configured here — lib/store/firebase.ts falls back to a
# service-account JSON only when running locally.

runConfig:
  # A teardown read is I/O against Graph and Firestore, not computation.
  cpu: 1
  memoryMiB: 512
  minInstances: 0
  maxInstances: 4
  concurrency: 80

# Every `secret:` below MUST already exist in Cloud Secret Manager, with at
# least one version. App Hosting resolves secrets before the build starts and
# fails the rollout in seconds if one is missing — and Secret Manager refuses
# an empty payload, so a placeholder is not an option either. The rollout of
# 6 Sep 2026 failed exactly this way, on eight secrets declared before they
# were created.
#
# App Hosting also rejects a plain `value: ""` as "not formatted properly" —
# the first failed rollout — so an unset variable is the only honest way to
# say "not configured".
#
# So the rule is: create the secret first, then add its stanza here. A channel
# that is not configured is simply absent from this file; every consumer
# treats an unset variable as "not configured" and lib/config/check.ts reports
# it in the console. Recipes for the channels not yet wired are at the bottom.
#
# NEXT_PUBLIC_* would carry BUILD as well as RUNTIME: Next inlines them into
# the browser bundle at build time, so a RUNTIME-only declaration would leave
# every client-side reference holding the fallback from lib/data/company.ts
# while the server used the real value.

env:
  # Values live in Cloud Secret Manager, never in this file.
  - variable: META_ACCESS_TOKEN
    secret: META_ACCESS_TOKEN
    availability: [RUNTIME]

  - variable: META_IG_USER_ID
    secret: META_IG_USER_ID
    availability: [RUNTIME]

  # Gemini, via Vertex AI on this same project. Deliberately NOT a secret:
  # the runtime service account authenticates on its own, exactly as it does
  # for Firestore, so there is no key to rotate and no way to leak one. It
  # needs roles/aiplatform.user, granted to
  # firebase-app-hosting-compute@pravda-jo.iam.gserviceaccount.com.
  #
  # VERTEX_PROJECT is unset here on purpose: it falls back to
  # GOOGLE_CLOUD_PROJECT, which App Hosting already sets to this project. It
  # exists only for a developer machine, where GOOGLE_CLOUD_PROJECT points at
  # the Firestore emulator instead.
  # Photographs of the talent library. A dedicated private bucket, not the
  # project's Firebase default: the default bucket's location is permanent
  # project-wide, while this one can be recreated elsewhere while it is empty.
  #
  # europe-west4, alongside this backend, because photos are streamed through
  # the app's own route handlers (never served from the bucket), so a bucket in
  # another region would add latency and egress to every thumbnail. Public
  # access prevention is enforced and uniform bucket-level access is on; the
  # runtime service account holds roles/storage.objectAdmin on this bucket
  # alone. Photos of Jordanian residents stored in the EU is a transfer outside
  # Jordan under PDPL, as Firestore in nam5 already is — disclose both.
  - variable: STORAGE_BUCKET
    value: pravda-jo-talent-photos
    availability: [RUNTIME]

  - variable: VERTEX_LOCATION
    value: global
    availability: [RUNTIME]

  - variable: OPERATOR_KEY
    secret: OPERATOR_KEY
    availability: [RUNTIME]

  # Signs the operator session cookie. Separate from OPERATOR_KEY so revoking
  # every live session is a secret rotation rather than a password change.
  - variable: SESSION_SECRET
    secret: SESSION_SECRET
    availability: [RUNTIME]

  # The read sweeper's only lock. Unset means /api/cron/read is closed, which
  # means the read is best-effort again.
  - variable: CRON_SECRET
    secret: CRON_SECRET
    availability: [RUNTIME]

  # Signs provider sessions on their own, so rotating SESSION_SECRET does not
  # sign every provider out on the morning of a shoot.
  - variable: TALENT_SESSION_SECRET
    secret: TALENT_SESSION_SECRET
    availability: [RUNTIME]

  # Khaled's own number, and so the destination of every new-lead notice until
  # a bot or an approved template exists. Deliberately not the studio's
  # published line, which is answered by whoever is nearest. A personal number
  # is a secret even though it only ever ends up in a wa.me link.
  - variable: OPERATOR_PHONE
    secret: OPERATOR_PHONE
    availability: [RUNTIME]

  # Pinned deliberately: a Graph version bump can change field availability on
  # the business_discovery edge, so it moves when we have tested it moving.
  - variable: META_API_VERSION
    value: v21.0
    availability: [RUNTIME]

